name: Build and Diagnose RR Shop Management APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Create signing key
        run: |
          keytool -genkeypair -v \
            -keystore rr-test.keystore \
            -alias rrtest \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=RR Shop Management, OU=RR, O=RR, L=Khulna, ST=Khulna, C=BD"

      - name: Find Android Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "BUILD_TOOLS=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)" >> $GITHUB_ENV

      - name: Zipalign APK
        run: |
          $BUILD_TOOLS/zipalign -p -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        run: |
          $BUILD_TOOLS/apksigner sign \
            --ks rr-test.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out android/app/build/outputs/apk/release/app-release.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify APK
        run: |
          $BUILD_TOOLS/apksigner verify --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Inspect APK
        run: |
          echo "===== APK INFORMATION ====="
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer apk summary \
            android/app/build/outputs/apk/release/app-release.apk

          echo "===== PACKAGE ====="
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest application-id \
            android/app/build/outputs/apk/release/app-release.apk

          echo "===== MIN SDK ====="
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest min-sdk \
            android/app/build/outputs/apk/release/app-release.apk

          echo "===== TARGET SDK ====="
          $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer manifest target-sdk \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: RR-Shop-Management-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
